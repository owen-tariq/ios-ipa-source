name: Yozora WebGL symbol diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/yozora-webgl-symbol-diagnosis.yml
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Inspect WebGL and options setter in upstream executable
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o yozora.ipa https://github.com/sqmrak/yozora/releases/download/v1.1.0-stable/Yozora-v1.1.0-stable-arm64.ipa
          unzip -q yozora.ipa
          echo '== methods and functions =='
          xcrun nm -an Payload/Yozora.app/Yozora | grep -E 'GL_GetInternalformativRobustANGLE|applyToCore|yozora_set_options|YZSettings' | head -70 || true
          echo '== ObjC selector references =='
          xcrun llvm-objdump --macho --objc-meta-data Payload/Yozora.app/Yozora 2>&1 | grep -A12 -B5 'applyToCore' | head -95 || true
          echo '== GLEngine import and GLS shim symbols =='
          xcrun nm -an Payload/Yozora.app/Yozora | grep -E 'GetInternalformativ|GLEngine' | head -25 || true
          echo '== Clang / LLVM tools =='
          xcrun --find llvm-objdump

name: Yozora WebGL symbol diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/yozora-webgl-symbol-diagnosis.yml
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Inspect upstream executable symbols
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o yozora.ipa https://github.com/sqmrak/yozora/releases/download/v1.1.0-stable/Yozora-v1.1.0-stable-arm64.ipa
          unzip -q yozora.ipa
          xcrun nm -a Payload/Yozora.app/Yozora | grep -E '(_yozora_set_options|_yozora_core_set|_OBJC_CLASS_._YZSettings)' || true
          echo "== global external symbols =="
          xcrun nm -g Payload/Yozora.app/Yozora | grep -E '(_yozora_set_options|_OBJC_CLASS_._YZSettings)' || true
          echo "== private / exported symbols =="
          xcrun dyld_info -exports Payload/Yozora.app/Yozora 2>/dev/null | grep -E '(_yozora_set_options|_OBJC_CLASS_._YZSettings)' || true
          echo "== symbol presence verification =="
          xcrun nm -a Payload/Yozora.app/Yozora | grep -F '_yozora_set_options' || echo "No function in symbol table"
